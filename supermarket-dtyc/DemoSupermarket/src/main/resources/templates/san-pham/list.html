<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{})}">
<head><title>Sản phẩm &amp; tồn kho · FreshMart</title></head>
<body>
<main>
    <div class="page-header">
        <div>
            <h1><i class="bi bi-boxes text-success me-2"></i>Sản phẩm &amp; tồn kho</h1>
            <div class="crumb"><a th:href="@{/}">Dashboard</a> / Sản phẩm · Bảng <span class="code">SP</span> + <span class="code">LOAISP</span> + <span class="code">THUONGHIEU</span> + <span class="code">SPCUTHE</span></div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/nhap-kho/moi}" class="btn btn-outline-success"><i class="bi bi-box-arrow-in-down me-1"></i>Nhập kho thêm</a>
            <a th:href="@{/don-hang/moi}" class="btn btn-brand"><i class="bi bi-cart-plus me-1"></i>Tạo đơn bán</a>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form class="row g-2 align-items-end" method="get">
                <div class="col-md-5">
                    <label class="form-label">Tìm sản phẩm</label>
                    <input name="q" class="form-control" th:value="${q}" placeholder="Mã hoặc tên sản phẩm...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Loại sản phẩm (LOAISP)</label>
                    <select name="loai" class="form-select">
                        <option value="">— Tất cả loại —</option>
                        <option th:each="l : ${dsLoai}" th:value="${l}" th:text="${l}" th:selected="${l == loai}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn btn-success"><i class="bi bi-search me-1"></i>Lọc</button>
                    <a th:href="@{/san-pham}" class="btn btn-light">Xóa lọc</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Loại / Thương hiệu</th>
                    <th class="text-end">Giá bán</th>
                    <th class="text-center">Tồn sổ sách<br><small class="text-muted fw-normal">(SP.so_luong)</small></th>
                    <th class="text-center">Serial trong kho<br><small class="text-muted fw-normal">(SPCUTHE)</small></th>
                    <th class="text-center">Đã bán</th>
                    <th class="text-center">Lỗi/Hủy</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sp : ${ds}">
                    <td><span class="code" th:text="${sp.maSanPham}"></span></td>
                    <td>
                        <div class="fw-semibold" th:text="${sp.ten}"></div>
                        <small class="text-muted" th:text="${sp.moTa ?: ''}"></small>
                    </td>
                    <td>
                        <span th:text="${sp.tenLoai}"></span><br>
                        <small class="text-muted"><i class="bi bi-tag me-1"></i><span th:text="${sp.tenThuongHieu}"></span></small>
                    </td>
                    <td class="text-end money fw-semibold" th:text="${@ui.money(sp.giaBan)} + ' / ' + ${sp.donViTinh}"></td>
                    <td class="text-center">
                        <span class="badge" th:classappend="${sp.soLuong < 10} ? 'text-bg-danger' : 'text-bg-light text-dark border'"
                              th:text="${sp.soLuong + ' ' + sp.donViTinh}"></span>
                    </td>
                    <td class="text-center">
                        <span class="serial-chip TRONG_KHO" th:text="${sp.serialTrongKho}"></span>
                    </td>
                    <td class="text-center">
                        <span class="serial-chip DA_BAN" th:text="${sp.serialDaBan}"></span>
                    </td>
                    <td class="text-center">
                        <span class="serial-chip LOI" th:text="${sp.serialLoi}"></span>
                    </td>
                    <td>
                        <span class="badge" th:classappend="'text-bg-' + ${@ui.color(sp.trangThai)}" th:text="${@ui.label(sp.trangThai)}"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ds)}"><td colspan="9" class="empty"><i class="bi bi-inbox"></i>Không tìm thấy sản phẩm</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
