<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{})}">
<head><title>Thông báo · FreshMart</title></head>
<body>
<main>
    <div class="card mx-auto my-5" style="max-width:560px">
        <div class="card-body text-center p-5">
            <i class="bi bi-exclamation-octagon text-danger" style="font-size:3rem"></i>
            <h4 class="fw-bold mt-3" th:text="${title ?: 'Đã xảy ra lỗi'}"></h4>
            <p class="text-muted" th:text="${message}"></p>
            <a th:href="@{/}" class="btn btn-brand mt-2"><i class="bi bi-house me-1"></i>Về trang chủ</a>
        </div>
    </div>
</main>
</body>
</html>
